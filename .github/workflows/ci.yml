name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore tests/RailApi.Tests/RailApi.Tests.csproj

      - name: Build
        run: dotnet build tests/RailApi.Tests/RailApi.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/RailApi.Tests/RailApi.Tests.csproj --configuration Release --no-build --verbosity normal

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t rail-api:${{ github.sha }} .
